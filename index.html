<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Basketball Champions League komandų suvestinė" />
<title>BCL Komandos</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--text:#1a1d23;--muted:#6b7280;--border:#e5e7eb;
  --accent:#2563eb;--win:#16a34a;--loss:#dc2626;--win-bg:#dcfce7;--loss-bg:#fee2e2;
  --group-a:#ef4444;--group-b:#f97316;--group-c:#eab308;--group-d:#22c55e;
  --group-e:#06b6d4;--group-f:#3b82f6;--group-g:#8b5cf6;--group-h:#ec4899;
  --radius:14px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-hover:0 8px 24px rgba(0,0,0,.10);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1116;--surface:#1a1d23;--text:#e5e7eb;--muted:#9ca3af;--border:#2a2f3a;
  --win-bg:#14371f;--loss-bg:#3a1418;--shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-hover:0 8px 24px rgba(0,0,0,.6);
}}
[data-theme="dark"]{color-scheme:dark;--bg:#0f1116;--surface:#1a1d23;--text:#e5e7eb;--muted:#9ca3af;--border:#2a2f3a;--win-bg:#14371f;--loss-bg:#3a1418;--shadow-hover:0 8px 24px rgba(0,0,0,.6)}
[data-theme="light"]{color-scheme:light;--bg:#f7f8fa;--surface:#fff;--text:#1a1d23;--muted:#6b7280;--border:#e5e7eb;--win-bg:#dcfce7;--loss-bg:#fee2e2;--shadow-hover:0 8px 24px rgba(0,0,0,.10)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.topbar h1{font-size:1.15rem;margin:0;letter-spacing:-.01em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1}
.controls input[type="search"],.controls select{padding:7px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;transition:border-color .15s}
.controls input[type="search"]:focus,.controls select:focus{outline:none;border-color:var(--accent)}
.controls input[type="search"]{min-width:180px;flex:1;max-width:300px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:5px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:.85rem;font-weight:500;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .count{opacity:.6;font-size:.75rem;margin-left:3px}
.toggle{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer;user-select:none}
#theme-toggle{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:1rem;transition:all .15s}
#theme-toggle:hover{background:var(--bg)}
.updated{color:var(--muted);font-size:.8rem;width:100%;margin:0}

main{padding:20px;max-width:1400px;margin:0 auto;padding-bottom:80px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

/* ═══ KORTELĖ ═══ */
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;transition:transform .18s,box-shadow .18s;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);transition:height .18s}
.card[data-group="A"]::before{background:var(--group-a)}
.card[data-group="B"]::before{background:var(--group-b)}
.card[data-group="C"]::before{background:var(--group-c)}
.card[data-group="D"]::before{background:var(--group-d)}
.card[data-group="E"]::before{background:var(--group-e)}
.card[data-group="F"]::before{background:var(--group-f)}
.card[data-group="G"]::before{background:var(--group-g)}
.card[data-group="H"]::before{background:var(--group-h)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.card:hover::before{height:5px}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.team-name{font-size:1.05rem;font-weight:700;margin:0;line-height:1.25;letter-spacing:-.01em}
.record-badge{background:var(--win-bg);color:var(--win);font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.record-badge.losing{background:var(--loss-bg);color:var(--loss)}
.record-badge.none{background:var(--border);color:var(--muted);font-weight:500;font-size:.7rem}

.group-tag{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:6px;color:#fff;background:var(--accent);align-self:flex-start;letter-spacing:.02em}
.group-tag[data-group="A"]{background:var(--group-a)}
.group-tag[data-group="B"]{background:var(--group-b)}
.group-tag[data-group="C"]{background:var(--group-c)}
.group-tag[data-group="D"]{background:var(--group-d)}
.group-tag[data-group="E"]{background:var(--group-e)}
.group-tag[data-group="F"]{background:var(--group-f)}
.group-tag[data-group="G"]{background:var(--group-g)}
.group-tag[data-group="H"]{background:var(--group-h)}

.next-match{border-top:1px solid var(--border);padding-top:12px}
.next-match .label{margin:0 0 6px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.next-line{margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.next-time{font-weight:600}
.next-countdown{font-size:.8rem;color:var(--muted)}
.next-opponent{margin:6px 0 0;font-size:.9rem}

.recent{margin-top:auto;border-top:1px solid var(--border);padding-top:10px}
.recent summary{cursor:pointer;font-size:.85rem;color:var(--muted);user-select:none;font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
.recent summary::-webkit-details-marker{display:none}
.recent summary::before{content:"▸";transition:transform .15s;display:inline-block}
.recent[open] summary::before{transform:rotate(90deg)}
.match-list{list-style:none;padding:8px 0 0;margin:0;display:flex;flex-direction:column;gap:6px}
.match-row{display:flex;align-items:center;gap:8px;font-size:.85rem}
.result-pill{font-weight:700;font-size:.7rem;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;flex-shrink:0}
.result-pill.win{background:var(--win-bg);color:var(--win)}
.result-pill.loss{background:var(--loss-bg);color:var(--loss)}
.match-opponent{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-score{font-weight:600}
.venue-icon{color:var(--muted);font-size:.75rem;flex-shrink:0}

/* ═══ BŪSENŲ BANNER'IAI ═══ */
.status-banner{background:var(--bg);color:var(--muted);font-size:.8rem;padding:10px 12px;border-radius:8px;text-align:center;border:1px dashed var(--border)}
.status-banner.warn{background:#fef3c7;color:#92400e;border-color:#fcd34d;border-style:solid}
.status-banner.info{background:#dbeafe;color:#1e40af;border-color:#93c5fd;border-style:solid}

/* ═══ TUŠČIA BŪSENA ═══ */
.empty-state{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted)}
.empty-state .icon{font-size:3rem;margin-bottom:12px;opacity:.5}
.empty-state h3{margin:0 0 6px;color:var(--text);font-size:1.1rem}
.empty-state p{margin:0;font-size:.9rem}

.unavailable-section{margin-top:40px}
.unavailable-section h2{font-size:1rem;color:var(--muted);margin:0 0 12px;font-weight:600}

/* ═══ Į VIRŠŲ MYGTUKAS ═══ */
#back-to-top{position:fixed;right:20px;bottom:20px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(10px);z-index:20}
#back-to-top.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
#back-to-top:hover{transform:translateY(-2px)}

@media (max-width:600px){
  .topbar{padding:10px 12px}
  main{padding:12px;padding-bottom:80px}
  .grid{grid-template-columns:1fr}
  .team-name{font-size:1rem}
}
</style>
</head>
<body>
<header class="topbar">
  <h1>🏀 BCL Komandos</h1>
  <div class="controls">
    <input id="search" type="search" placeholder="Ieškoti komandos…" aria-label="Ieškoti komandos" />
    <div id="group-filters" class="chips" role="group" aria-label="Filtruoti pagal grupę"></div>
    <label class="toggle">
      <input id="only-upcoming" type="checkbox" />
      <span>Tik su rungtynėmis</span>
    </label>
    <select id="sort" aria-label="Rikiavimas">
      <option value="name">Vardas</option>
      <option value="record">Pergalės</option>
      <option value="next">Kitos rungtynės</option>
    </select>
    <button id="theme-toggle" aria-label="Perjungti temą">🌙</button>
  </div>
  <p id="updated" class="updated"></p>
</header>

<main>
  <section id="teams-grid" class="grid" aria-live="polite"></section>
  <section id="unavailable" class="unavailable-section" hidden>
    <h2>Nepasiekiama</h2>
    <div id="unavailable-grid" class="grid"></div>
  </section>
</main>

<button id="back-to-top" aria-label="Į viršų">↑</button>

<template id="team-card-template">
  <article class="card" tabindex="0">
    <header class="card-header">
      <h3 class="team-name"></h3>
      <span class="record-badge"></span>
    </header>
    <span class="group-tag"></span>
    <div class="next-match">
      <p class="label">Kitos rungtynės</p>
      <p class="next-line">
        <span class="next-time"></span>
        <span class="next-countdown"></span>
      </p>
      <p class="next-opponent"></p>
    </div>
    <details class="recent">
      <summary>Paskutinės rungtynės</summary>
      <ul class="match-list"></ul>
    </details>
  </article>
</template>

<script>
const state = {
  teams: [],
  updatedAt: null,
  group: "ALL",
  search: "",
  onlyUpcoming: false,
  sort: "name",
  theme: localStorage.getItem("theme") || "auto"
};

const $ = s => document.querySelector(s);

function getResult(m) {
  const isHome = m.venue === "home";
  const teamScore = isHome ? m.homeScore : m.awayScore;
  const oppScore = isHome ? m.awayScore : m.homeScore;
  return teamScore > oppScore ? "W" : "L";
}

function winPct(r) {
  if (!r) return -1;
  const total = r.wins + r.losses;
  return total === 0 ? 0 : r.wins / total;
}

function sortTeams(teams, key) {
  const copy = [...teams];
  if (key === "record") {
    return copy.sort((a, b) => winPct(b.record) - winPct(a.record) || (b.record?.wins ?? 0) - (a.record?.wins ?? 0));
  }
  if (key === "next") {
    const far = Infinity;
    return copy.sort((a, b) => {
      const ta = a.nextMatch ? Date.parse(a.nextMatch.startUtc) : far;
      const tb = b.nextMatch ? Date.parse(b.nextMatch.startUtc) : far;
      return ta - tb;
    });
  }
  return copy.sort((a, b) => a.name.localeCompare(b.name, "lt"));
}

function formatLocal(iso) {
  if (!iso) return "—";
  return new Intl.DateTimeFormat("lt-LT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
}

function formatRelative(iso) {
  if (!iso) return "";
  const diff = Date.parse(iso) - Date.now();
  const abs = Math.abs(diff);
  const mins = Math.round(abs / 60000);
  const rtf = new Intl.RelativeTimeFormat("lt-LT", { numeric: "auto" });
  if (mins < 60) return rtf.format(Math.sign(diff) * mins, "minute");
  const hours = Math.round(mins / 60);
  if (hours < 24) return rtf.format(Math.sign(diff) * hours, "hour");
  return rtf.format(Math.sign(diff) * Math.round(hours / 24), "day");
}

function renderTeamCard(team) {
  const tpl = document.querySelector("#team-card-template").content.cloneNode(true);
  const card = tpl.querySelector(".card");
  if (team.group) card.dataset.group = team.group;

  card.querySelector(".team-name").textContent = team.name || "Nežinoma komanda";

  const badge = card.querySelector(".record-badge");
  if (team.record && (team.record.wins + team.record.losses) > 0) {
    badge.textContent = team.record.wins + "–" + team.record.losses;
    if (team.record.wins < team.record.losses) badge.classList.add("losing");
  } else {
    badge.textContent = "Nėra duomenų";
    badge.classList.add("none");
  }

  const tag = card.querySelector(".group-tag");
  if (team.group) {
    tag.textContent = team.group + " grupė";
    tag.dataset.group = team.group;
  } else {
    tag.textContent = "Be grupės";
    tag.style.background = "var(--muted)";
  }

  const nextBlock = card.querySelector(".next-match");
  if (team.nextMatch) {
    card.querySelector(".next-time").textContent = formatLocal(team.nextMatch.startUtc);
    card.querySelector(".next-countdown").textContent = "· " + formatRelative(team.nextMatch.startUtc);
    const venue = team.nextMatch.venue === "home" ? "namie" : "išvykoje";
    card.querySelector(".next-opponent").textContent = "vs " + team.nextMatch.opponent + " (" + venue + ")";
  } else {
    const banner = document.createElement("div");
    if (team.leagueStatus === "unknown") {
      banner.className = "status-banner warn";
      banner.textContent = "Nacionalinė lyga nerasta";
    } else if (team.leagueStatus === "not_started") {
      banner.className = "status-banner warn";
      banner.textContent = "Sezonas dar neprasidėjo";
    } else {
      banner.className = "status-banner info";
      banner.textContent = "Rungtynių data nežinoma";
    }
    nextBlock.replaceWith(banner);
  }

  const listEl = card.querySelector(".match-list");
  if (team.lastMatches && team.lastMatches.length) {
    team.lastMatches.slice(0, 5).forEach(m => {
      const li = document.createElement("li");
      li.className = "match-row";
      const r = getResult(m);
      const venueIcon = m.venue === "home" ? "🏠" : "✈️";
      li.innerHTML =
        '<span class="result-pill ' + (r === "W" ? "win" : "loss") + '">' + r + "</span>" +
        '<span class="venue-icon">' + venueIcon + "</span>" +
        '<span class="match-opponent"></span>' +
        '<span class="match-score">' + m.homeScore + "–" + m.awayScore + "</span>";
      li.querySelector(".match-opponent").textContent = m.opponent;
      listEl.appendChild(li);
    });
  } else {
    const li = document.createElement("li");
    li.className = "status-banner";
    li.textContent = "Sužaistų rungtynių dar nėra";
    listEl.appendChild(li);
  }

  return card;
}

function renderEmptyState(icon, title, message) {
  const div = document.createElement("div");
  div.className = "empty-state";
  div.innerHTML = '<div class="icon">' + icon + '</div><h3>' + title + '</h3><p>' + message + '</p>';
  return div;
}

function applyFilters() {
  const unavailable = state.teams.filter(x => x.leagueStatus === "unknown");
  let list = state.teams.filter(x => x.leagueStatus !== "unknown");
  if (state.group !== "ALL") list = list.filter(x => x.group === state.group);
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(x => x.name.toLowerCase().includes(q));
  }
  if (state.onlyUpcoming) list = list.filter(x => x.nextMatch);
  return { list: sortTeams(list, state.sort), unavailable };
}

function render() {
  const { list, unavailable } = applyFilters();
  const grid = $("#teams-grid");
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();

  if (list.length === 0) {
    frag.appendChild(renderEmptyState("🔍", "Nieko nerasta", "Pabandykite pakeisti filtrus arba paieškos žodį."));
  } else {
    list.forEach(team => frag.appendChild(renderTeamCard(team)));
  }
  grid.appendChild(frag);

  const unavailSection = $("#unavailable");
  const unavailGrid = $("#unavailable-grid");
  if (unavailable.length) {
    unavailSection.hidden = false;
    unavailGrid.innerHTML = "";
    unavailable.forEach(team => unavailGrid.appendChild(renderTeamCard(team)));
  } else {
    unavailSection.hidden = true;
  }

  const total = state.teams.length;
  const shown = list.length;
  const unavailableCount = unavailable.length;
  let updatedText = state.updatedAt
    ? "Atnaujinta: " + formatRelative(state.updatedAt) + " (" + formatLocal(state.updatedAt) + ")"
    : "";
  updatedText += " · Rodoma: " + shown + " / " + total;
  if (unavailableCount) updatedText += " (nepasiekiama: " + unavailableCount + ")";
  $("#updated").textContent = updatedText;
}

function renderGroupChips() {
  const counts = {};
  state.teams.forEach(t => {
    if (t.group && t.leagueStatus !== "unknown") {
      counts[t.group] = (counts[t.group] || 0) + 1;
    }
  });
  const groups = Object.keys(counts).sort();
  const container = $("#group-filters");
  container.innerHTML = "";

  const mkBtn = (label, value, count) => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.setAttribute("aria-pressed", state.group === value);
    btn.innerHTML = label + (count !== undefined ? ' <span class="count">(' + count + ')</span>' : "");
    btn.onclick = () => { state.group = value; renderGroupChips(); render(); };
    return btn;
  };

  const totalActive = state.teams.filter(t => t.leagueStatus !== "unknown").length;
  container.appendChild(mkBtn("Visos", "ALL", totalActive));
  groups.forEach(g => container.appendChild(mkBtn(g, g, counts[g])));
}

function applyTheme() {
  const root = document.documentElement;
  if (state.theme === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", state.theme);
  $("#theme-toggle").textContent = state.theme === "dark" ? "☀️" : "🌙";
}

async function loadData() {
  const res = await fetch("data/teams.json", { cache: "no-cache" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  state.teams = json.teams || [];
  state.updatedAt = json.updatedAt || null;
}

function bindEvents() {
  $("#search").addEventListener("input", e => { state.search = e.target.value; render(); });
  $("#only-upcoming").addEventListener("change", e => { state.onlyUpcoming = e.target.checked; render(); });
  $("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
  $("#theme-toggle").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    localStorage.setItem("theme", state.theme);
    applyTheme();
  });

  const backBtn = $("#back-to-top");
  backBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  window.addEventListener("scroll", () => {
    backBtn.classList.toggle("visible", window.scrollY > 400);
  });
}

(async function init() {
  try {
    await loadData();
  } catch (err) {
    console.error(err);
    const grid = $("#teams-grid");
    grid.innerHTML = "";
    grid.appendChild(renderEmptyState("⚠️", "Nepavyko įkelti duomenų", "Patikrinkite data/teams.json."));
    return;
  }
  bindEvents();
  applyTheme();
  renderGroupChips();
  render();
  setInterval(render, 60000);
})();
</script>
</body>
</html>
