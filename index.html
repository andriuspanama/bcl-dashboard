<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Basketball Champions League komandų suvestinė" />
<title>BCL Komandos</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--text:#1a1d23;--muted:#6b7280;--border:#e5e7eb;
  --accent:#2563eb;--win:#16a34a;--loss:#dc2626;--win-bg:#dcfce7;--loss-bg:#fee2e2;
  --group-a:#ef4444;--group-b:#f97316;--group-c:#eab308;--group-d:#22c55e;
  --group-e:#06b6d4;--group-f:#3b82f6;--group-g:#8b5cf6;--group-h:#ec4899;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1116;--surface:#1a1d23;--text:#e5e7eb;--muted:#9ca3af;--border:#2a2f3a;
  --win-bg:#14371f;--loss-bg:#3a1418;--shadow:0 1px 3px rgba(0,0,0,.4);
}}
[data-theme="dark"]{color-scheme:dark;--bg:#0f1116;--surface:#1a1d23;--text:#e5e7eb;--muted:#9ca3af;--border:#2a2f3a;--win-bg:#14371f;--loss-bg:#3a1418}
[data-theme="light"]{color-scheme:light;--bg:#f7f8fa;--surface:#fff;--text:#1a1d23;--muted:#6b7280;--border:#e5e7eb;--win-bg:#dcfce7;--loss-bg:#fee2e2}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.topbar h1{font-size:1.15rem;margin:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1}
.controls input[type="search"],.controls select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
.controls input[type="search"]{min-width:180px;flex:1;max-width:300px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:.85rem;transition:all .15s}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:6px;font-size:.9rem}
#theme-toggle{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:1rem}
.updated{color:var(--muted);font-size:.8rem;width:100%;margin:0}
main{padding:20px;max-width:1400px;margin:0 auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card-header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.team-name{font-size:1.1rem;font-weight:700;margin:0}
.record-badge{background:var(--win-bg);color:var(--win);font-weight:600;font-size:.85rem;padding:2px 10px;border-radius:999px;white-space:nowrap}
.record-badge.losing{background:var(--loss-bg);color:var(--loss)}
.record-badge.none{background:var(--border);color:var(--muted)}
.group-tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:4px;color:#fff;background:var(--accent);align-self:flex-start}
.group-tag[data-group="A"]{background:var(--group-a)}
.group-tag[data-group="B"]{background:var(--group-b)}
.group-tag[data-group="C"]{background:var(--group-c)}
.group-tag[data-group="D"]{background:var(--group-d)}
.group-tag[data-group="E"]{background:var(--group-e)}
.group-tag[data-group="F"]{background:var(--group-f)}
.group-tag[data-group="G"]{background:var(--group-g)}
.group-tag[data-group="H"]{background:var(--group-h)}
.next-match{border-top:1px solid var(--border);padding-top:10px}
.next-match .label{margin:0 0 4px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.next-line{margin:0;display:flex;gap:8px;align-items:baseline}
.next-time{font-weight:600}
.next-countdown{font-size:.8rem;color:var(--muted)}
.next-opponent{margin:4px 0 0;font-size:.9rem}
.recent{margin-top:auto;border-top:1px solid var(--border);padding-top:8px}
.recent summary{cursor:pointer;font-size:.85rem;color:var(--muted);user-select:none}
.match-list{list-style:none;padding:6px 0 0;margin:0;display:flex;flex-direction:column;gap:4px}
.match-row{display:flex;align-items:center;gap:8px;font-size:.85rem}
.result-pill{font-weight:700;font-size:.7rem;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;flex-shrink:0}
.result-pill.win{background:var(--win-bg);color:var(--win)}
.result-pill.loss{background:var(--loss-bg);color:var(--loss)}
.match-opponent{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-score{font-weight:600}
.venue-icon{color:var(--muted);font-size:.75rem}
.status-banner{background:var(--border);color:var(--muted);font-size:.8rem;padding:8px 10px;border-radius:6px;text-align:center}
.status-banner.warn{background:#fef3c7;color:#92400e}
.unavailable-section{margin-top:32px}
.unavailable-section h2{font-size:1rem;color:var(--muted)}
@media (max-width:600px){.topbar{padding:10px 12px}main{padding:12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <h1>🏀 BCL Komandos</h1>
  <div class="controls">
    <input id="search" type="search" placeholder="Ieškoti komandos…" aria-label="Ieškoti komandos" />
    <div id="group-filters" class="chips" role="group" aria-label="Filtruoti pagal grupę"></div>
    <label class="toggle">
      <input id="only-upcoming" type="checkbox" />
      <span>Tik su rungtynėmis</span>
    </label>
    <select id="sort" aria-label="Rikiavimas">
      <option value="name">Vardas</option>
      <option value="record">Pergalės</option>
      <option value="next">Kitos rungtynės</option>
    </select>
    <button id="theme-toggle" aria-label="Perjungti temą">🌙</button>
  </div>
  <p id="updated" class="updated"></p>
</header>

<main>
  <section id="teams-grid" class="grid" aria-live="polite"></section>
  <section id="unavailable" class="unavailable-section" hidden>
    <h2>Nepasiekiama</h2>
    <div id="unavailable-grid" class="grid"></div>
  </section>
  <div id="error-message" style="display:none" class="status-banner warn"></div>
</main>

<template id="team-card-template">
  <article class="card" tabindex="0">
    <header class="card-header">
      <h3 class="team-name"></h3>
      <span class="record-badge"></span>
    </header>
    <span class="group-tag"></span>
    <div class="next-match">
      <p class="label">Kitos rungtynės</p>
      <p class="next-line">
        <span class="next-time"></span>
        <span class="next-countdown"></span>
      </p>
      <p class="next-opponent"></p>
    </div>
    <details class="recent">
      <summary>Paskutinės rungtynės</summary>
      <ul class="match-list"></ul>
    </details>
  </article>
</template>

<script>
const state = {
  teams: [],
  updatedAt: null,
  group: "ALL",
  search: "",
  onlyUpcoming: false,
  sort: "name",
  theme: localStorage.getItem("theme") || "auto"
};

const $ = s => document.querySelector(s);

function getResult(m) {
  const isHome = m.venue === "home";
  const teamScore = isHome ? m.homeScore : m.awayScore;
  const oppScore = isHome ? m.awayScore : m.homeScore;
  return teamScore > oppScore ? "W" : "L";
}

function winPct(r) {
  if (!r) return -1;
  const total = r.wins + r.losses;
  return total === 0 ? 0 : r.wins / total;
}

function sortTeams(teams, key) {
  const copy = [...teams];
  if (key === "record") {
    return copy.sort((a, b) => winPct(b.record) - winPct(a.record) || (b.record?.wins ?? 0) - (a.record?.wins ?? 0));
  }
  if (key === "next") {
    const far = Infinity;
    return copy.sort((a, b) => {
      const ta = a.nextMatch ? Date.parse(a.nextMatch.startUtc) : far;
      const tb = b.nextMatch ? Date.parse(b.nextMatch.startUtc) : far;
      return ta - tb;
    });
  }
  return copy.sort((a, b) => a.name.localeCompare(b.name, "lt"));
}

function formatLocal(iso) {
  if (!iso) return "—";
  return new Intl.DateTimeFormat("lt-LT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
}

function formatRelative(iso) {
  if (!iso) return "";
  const diff = Date.parse(iso) - Date.now();
  const abs = Math.abs(diff);
  const mins = Math.round(abs / 60000);
  const rtf = new Intl.RelativeTimeFormat("lt-LT", { numeric: "auto" });
  if (mins < 60) return rtf.format(Math.sign(diff) * mins, "minute");
  const hours = Math.round(mins / 60);
  if (hours < 24) return rtf.format(Math.sign(diff) * hours, "hour");
  return rtf.format(Math.sign(diff) * Math.round(hours / 24), "day");
}

function renderTeamCard(team) {
  const tpl = document.querySelector("#team-card-template").content.cloneNode(true);
  const card = tpl.querySelector(".card");

  card.querySelector(".team-name").textContent = team.name;

  const badge = card.querySelector(".record-badge");
  if (team.record && team.record.wins + team.record.losses > 0) {
    badge.textContent = team.record.wins + "–" + team.record.losses;
    if (team.record.wins < team.record.losses) badge.classList.add("losing");
  } else {
    badge.textContent = "—";
    badge.classList.add("none");
  }

  const tag = card.querySelector(".group-tag");
  if (team.group) {
    tag.textContent = team.group + " grupė";
    tag.dataset.group = team.group;
  } else {
    tag.textContent = "—";
    tag.style.background = "var(--muted)";
  }

  const nextBlock = card.querySelector(".next-match");
  if (team.nextMatch) {
    card.querySelector(".next-time").textContent = formatLocal(team.nextMatch.startUtc);
    card.querySelector(".next-countdown").textContent = "· " + formatRelative(team.nextMatch.startUtc);
    const venue = team.nextMatch.venue === "home" ? "namie" : "išvykoje";
    card.querySelector(".next-opponent").textContent = "vs " + team.nextMatch.opponent + " (" + venue + ")";
  } else {
    const banner = document.createElement("div");
    banner.className = "status-banner warn";
    banner.textContent = team.leagueStatus === "not_started" ? "Sezonas dar neprasidėjo" : "Nacionalinė lyga nerasta";
    nextBlock.replaceWith(banner);
  }

  const listEl = card.querySelector(".match-list");
  card.querySelector(".recent summary").textContent = "Paskutinės rungtynės";
  if (team.lastMatches && team.lastMatches.length) {
    team.lastMatches.slice(0, 5).forEach(m => {
      const li = document.createElement("li");
      li.className = "match-row";
      const r = getResult(m);
      const venueIcon = m.venue === "home" ? "🏠" : "✈️";
      li.innerHTML =
        '<span class="result-pill ' + (r === "W" ? "win" : "loss") + '">' + r + "</span>" +
        '<span class="venue-icon">' + venueIcon + "</span>" +
        '<span class="match-opponent"></span>' +
        '<span class="match-score">' + m.homeScore + "–" + m.awayScore + "</span>";
      li.querySelector(".match-opponent").textContent = m.opponent;
      listEl.appendChild(li);
    });
  } else {
    const li = document.createElement("li");
    li.className = "status-banner";
    li.textContent = "Sužaistų rungtynių dar nėra";
    listEl.appendChild(li);
  }

  return card;
}

function applyFilters() {
  const unavailable = state.teams.filter(x => x.leagueStatus === "unknown");
  let list = state.teams.filter(x => x.leagueStatus !== "unknown");
  if (state.group !== "ALL") list = list.filter(x => x.group === state.group);
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(x => x.name.toLowerCase().includes(q));
  }
  if (state.onlyUpcoming) list = list.filter(x => x.nextMatch);
  return { list: sortTeams(list, state.sort), unavailable };
}

function render() {
  const { list, unavailable } = applyFilters();
  const grid = $("#teams-grid");
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  list.forEach(team => frag.appendChild(renderTeamCard(team)));
  grid.appendChild(frag);

  const unavailSection = $("#unavailable");
  const unavailGrid = $("#unavailable-grid");
  if (unavailable.length) {
    unavailSection.hidden = false;
    unavailGrid.innerHTML = "";
    unavailable.forEach(team => unavailGrid.appendChild(renderTeamCard(team)));
  } else {
    unavailSection.hidden = true;
  }

  $("#updated").textContent = state.updatedAt
    ? "Atnaujinta: " + formatRelative(state.updatedAt) + " (" + formatLocal(state.updatedAt) + ")"
    : "";
}

function renderGroupChips() {
  const groups = [...new Set(state.teams.map(t => t.group).filter(Boolean))].sort();
  const container = $("#group-filters");
  container.innerHTML = "";
  const mkBtn = (label, value) => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = label;
    btn.setAttribute("aria-pressed", state.group === value);
    btn.onclick = () => { state.group = value; renderGroupChips(); render(); };
    return btn;
  };
  container.appendChild(mkBtn("Visos", "ALL"));
  groups.forEach(g => container.appendChild(mkBtn(g, g)));
}

function applyTheme() {
  const root = document.documentElement;
  if (state.theme === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", state.theme);
  $("#theme-toggle").textContent = state.theme === "dark" ? "☀️" : "🌙";
}

async function loadData() {
  const res = await fetch("data/teams.json", { cache: "no-cache" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  state.teams = json.teams || [];
  state.updatedAt = json.updatedAt || null;
}

function bindEvents() {
  $("#search").addEventListener("input", e => { state.search = e.target.value; render(); });
  $("#only-upcoming").addEventListener("change", e => { state.onlyUpcoming = e.target.checked; render(); });
  $("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
  $("#theme-toggle").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    localStorage.setItem("theme", state.theme);
    applyTheme();
  });
}

(async function init() {
  try {
    await loadData();
  } catch (err) {
    console.error(err);
    const el = $("#error-message");
    el.style.display = "block";
    el.textContent = "Nepavyko įkelti duomenų. Patikrinkite data/teams.json.";
    return;
  }
  bindEvents();
  applyTheme();
  renderGroupChips();
  render();
  setInterval(render, 60000);
})();
</script>
</body>
</html>
